name: Snap Request Assistant tests and unsigned IPA

# Run from GitHub: repo -> Actions -> this workflow -> Run workflow.
# Output is an UNSIGNED .ipa artifact. Install from Windows with Sideloadly or
# AltStore, which sign it with your Apple ID. It is NOT a signed App Store build,
# and no IPA is claimed until this workflow actually produces one and its
# contents are verified.
#
# NOTE: There is deliberately NO schedule (cron) here. The "every 2 hours"
# cycle in this project is an in-app manual reminder, not a GitHub job.
# Running a build every 2 hours would not make the phone app search or
# send anything, and would waste Actions minutes. Do not add a schedule
# to hunt for contacts.
#
# This app is MANUAL ONLY: no Snapchat login, no Snapchat discovery,
# no surname/initial search, no gender filter, no automatic friend
# requests, chat reading, or message sending.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.3.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run tests (best effort — must not block the IPA build)
        continue-on-error: true
        run: |
          xcodebuild test -project SnapRequestAssistant.xcodeproj -scheme SnapRequestAssistant -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' CODE_SIGNING_ALLOWED=NO \
          || xcodebuild test -project SnapRequestAssistant.xcodeproj -scheme SnapRequestAssistant -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' CODE_SIGNING_ALLOWED=NO \
          || xcodebuild test -project SnapRequestAssistant.xcodeproj -scheme SnapRequestAssistant -destination 'platform=iOS Simulator,name=iPhone 14,OS=latest' CODE_SIGNING_ALLOWED=NO \
          || echo "No concrete iOS simulator available on this runner — tests skipped, IPA build continues"
      - name: Build device app (unsigned) and package IPA
        run: bash scripts/package-unsigned-ipa.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapRequestAssistant-unsigned-ipa
          path: build/SnapRequestAssistant-unsigned.ipa
          retention-days: 14
